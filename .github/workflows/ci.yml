name: Android CI/CD with Release and Notification

on:
  push:
    branches: [ main,ci_debug ]

#ci应该有 代码风格监测，依赖风险监测，单测，集成测试等等

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}

    steps:
      - name: 📂 拉取代码
        uses: actions/checkout@v4

      - name: 给 gradlew 授权
        run: chmod +x ./gradlew

      - name: ☕️ 设置 Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ 缓存 Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 🔐 解码 keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: 📆 生成版本号
        id: versioning
        run: bash .github/workflows/set_version.sh

      - name: 依赖安全检查
        uses: owasp/dependency-check-action@v2
        with:
          project: 'HRouter'
          format: 'ALL'
          scan: './'


      - name: 运行单元测试
        run: ./gradlew test

      - name: 👼 构建 release APK
        run: ./gradlew assembleRelease -Psigning.store.file=keystore.jks -Psigning.store.password=${{ secrets.SIGNING_STORE_PASSWORD }} -Psigning.key.alias=${{ secrets.SIGNING_KEY_ALIAS }} -Psigning.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: 📦 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📂 拉取代码
        uses: actions/checkout@v4

      - name: 🎉 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ needs.build.outputs.version }}
          tag_name: ${{ needs.build.outputs.version }}
          files: app/build/outputs/apk/release/*.apk
